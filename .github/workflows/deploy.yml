# Every push tests everything: the contract, the wallet, the SDK and every game. A push to main is the release: it
# publishes dist/ as the Worker named in wrangler.jsonc, and each games/<id> as the Worker named in its own.
# Settings (repository → Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN    a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   variable CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID
# Only main publishes: every other branch stops after the tests.
# Without the token even main stops there; it just does not publish.
name: Deploy
on: [push, workflow_dispatch]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOOKEDIN_CLIENT_CONFIG: config/production.json
      # Whether the token is set, not the token: only the step that publishes is given that.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The contract tests run against a local Anvil chain.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - run: npm run format:check
      # The tests build dist/ and every games/<id>/dist first, so what passed is what is published.
      - run: npm test
      - name: Publish to Cloudflare
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # A game's wrangler runs from its own folder, where its build command expects to be.
        run: |
          npx wrangler deploy
          for game in games/*/; do (cd "$game" && npx wrangler deploy); done
